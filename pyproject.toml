[project]
name = "wia"
version = "0.1.0"
description = "Writing Intelligence Assistant — Dutch + English AI detection, humanizing and writing analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trydynt (RelicSMP)" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
wia = "wia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wia*"]

[tool.setuptools.package-data]
wia = ["data/humanbench/*.jsonl", "detector/weights.json", "web/*", "lexicons/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
